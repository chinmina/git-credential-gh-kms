# yaml-language-server: $schema=https://raw.githubusercontent.com/binary-install/binstaller/main/schema/InstallSpec.json
# Regenerate with `binst init --source goreleaser` when archives or platforms change in .goreleaser.yaml.
# binst 0.12.0 rejects commit_author.use_github_app_token, so strip it from a copy first.
schema: v1
name: git-credential-gh-kms
repo: chinmina/git-credential-gh-kms
asset:
  template: ${NAME}_${OS}_${ARCH}${EXT}
  default_extension: .tar.gz
  rules:
  - when:
      os: windows
    ext: .zip
  naming_convention:
    os: lowercase
    arch: lowercase
checksums:
  algorithm: sha256
  template: checksums.txt
supported_platforms:
- os: darwin
  arch: amd64
- os: darwin
  arch: arm64
- os: linux
  arch: amd64
- os: linux
  arch: arm64
- os: windows
  arch: amd64
- os: windows
  arch: arm64
